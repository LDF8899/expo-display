<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页轮播效果提取</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="demo-page">
      <section class="extract-note">
        <p>Extracted from zfhstech.com home</p>
        <h1>首页 Coverflow 轮播效果</h1>
        <span>4 秒自动播放 · 中间图放大 · 两侧 3D 倾斜 · 非激活图模糊</span>
      </section>

      <section class="hero-carousel" aria-label="首页轮播图">
        <button class="carousel-button prev" type="button" aria-label="上一张"></button>
        <div class="carousel-stage" id="carouselStage"></div>
        <button class="carousel-button next" type="button" aria-label="下一张"></button>
        <div class="carousel-pagination" id="carouselPagination" aria-label="轮播分页"></div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
