<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>毕节职业技术学院专题二级页面</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef0e8;
      color: #314b4c;
      font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
    }
    main {
      width: min(980px, calc(100vw - 48px));
      padding: 40px;
      border-radius: 24px;
      background: rgba(255, 253, 248, 0.9);
      box-shadow: 0 20px 52px rgba(55, 73, 69, 0.14);
    }
    h1 { margin: 0 0 24px; font-size: 34px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    a {
      display: block;
      padding: 18px 20px;
      border: 1px solid rgba(178, 157, 118, 0.32);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
      background: rgba(255,255,255,0.7);
    }
    a:hover { border-color: #bb9051; }
  </style>
</head>
<body>
  <main>
    <h1>专题二级页面</h1>
    <div class="grid">
        <a href="department-modern-agriculture.html">现代农业专题</a>
        <a href="department-digital-tourism.html">数字文旅专题</a>
        <a href="department-smart-healthcare.html">智慧康养专题</a>
        <a href="department-finance-commerce.html">财经商贸专题</a>
        <a href="department-digital-tech.html">数智技术专题</a>
        <a href="department-smart-energy.html">智慧能源专题</a>
        <a href="department-intelligent-manufacturing.html">智能制造专题</a>
        <a href="department-campus-culture.html">同心校园文化</a>
    </div>
  </main>
</body>
</html>
