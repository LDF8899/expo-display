services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expo_display}
      MYSQL_USER: ${MYSQL_USER:-expo_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:18080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      TRUST_PROXY_HEADERS: 1
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CSRF_SECRET: ${CSRF_SECRET:?set CSRF_SECRET in .env}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-10}
      ALLOW_WEAK_USER_PASSWORDS: ${ALLOW_WEAK_USER_PASSWORDS:-0}
      DATABASE_BACKEND: mysql
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-expo_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expo_display}
      MYSQL_SCHEMA_PATH: database/mysql_schema.sql
      ASSET_STORAGE_BACKEND: local
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: 5242880
      ALLOW_SVG_UPLOADS: 0
    volumes:
      - uploaded-assets:/app/uploads
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-18080}:80"
    volumes:
      - ./deploy/nginx/expo-display.compose.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
  uploaded-assets:
